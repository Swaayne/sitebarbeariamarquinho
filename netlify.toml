[build]
  base = "."
  command = "pnpm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  SITE_BASE_PATH = ""
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# Next.js exports static files. No server adapter, Functions or SPA fallback needed.

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
